[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eps-audit"
version = "1.0.0"
description = "Evidence-Preserving Sparsification: auditable reduction of scientific knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mehrdad Jalali"}, {name = "Mohammad H. Nadimi-Shahraki"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "networkx>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
